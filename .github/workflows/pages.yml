name: publish comparison gallery

on:
  push:
    branches: [main]
    paths:
      - 'workflow_explanations/gallery/**'
      - 'workflow_explanations/examples/**'
      - 'workflow_explanations/experiments/results.json'
      - 'scripts/build-gallery.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-packages.mjs
      - run: node scripts/check-html-task-scope.mjs
      - run: node scripts/check-gallery-artifacts.mjs
      - run: node scripts/build-gallery.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
