name: verify packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-packages.mjs
      - run: node scripts/check-html-task-scope.mjs
      - run: node scripts/check-gallery-artifacts.mjs
      - run: node scripts/build-gallery.mjs
